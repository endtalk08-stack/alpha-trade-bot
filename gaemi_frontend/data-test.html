<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gaemiGTP | 알파봇 데이터 연결 검증</title>
<style>body{font:15px system-ui,sans-serif;background:#121316;color:#f3f4f6;max-width:680px;margin:36px auto;padding:0 18px}h1{font-size:22px}button{background:#f97316;color:white;border:0;border-radius:8px;padding:10px 16px;font-weight:bold;cursor:pointer}.panel{background:#1e2025;border:1px solid #3a3d43;border-radius:10px;padding:18px;margin-top:18px}a{color:#ffa657}dl{display:grid;grid-template-columns:130px 1fr;gap:12px}dt{color:#9ca3af}dd{margin:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#ddd}small{color:#aaa}</style></head>
<body><h1>삼성전자 데이터 연결 테스트</h1><p>gaemiGTP 화면 파일에서 동일 서버의 알파봇 <code>/api/chart</code> 데이터를 읽는지 검증합니다. 기존 화면은 변경하지 않습니다.</p><button id="run">삼성전자 API 다시 확인</button><p id="status" role="status">조회 준비 중</p><section class="panel"><dl><dt>종목</dt><dd>삼성전자</dd><dt>데이터 일자</dt><dd id="date">-</dd><dt>종가</dt><dd id="close">-</dd><dt>거래량</dt><dd id="volume">-</dd><dt>봉 데이터 수</dt><dd id="count">-</dd></dl></section><details class="panel"><summary>원본 API 응답 확인</summary><pre id="raw"></pre></details><p><a href="./">← gaemiGTP 화면으로 돌아가기</a></p><small>주의: 이 페이지는 연결 검증 전용이며 투자 추천이나 실시간 시세를 보장하지 않습니다.</small>
<script>
async function test(){let status=document.getElementById('status');status.textContent='알파봇 서버 연결 중...';try{let r=await fetch('/api/chart?q='+encodeURIComponent('삼성전자'),{cache:'no-store'});let j=await r.json();document.getElementById('raw').textContent=JSON.stringify(j,null,2).slice(0,20000);if(!r.ok)throw Error('HTTP '+r.status+' '+(j.error||''));let candles=j.candles||(j.chart&&j.chart.candles)||(j.chart_data&&j.chart_data.candles)||(j.data&&j.data.candles);if(!Array.isArray(candles)||!candles.length){status.textContent='API 응답 수신, 봉 데이터 형식 확인 필요';return;}let c=candles[candles.length-1];document.getElementById('date').textContent=c.time||'-';document.getElementById('close').textContent=Number(c.close).toLocaleString('ko-KR')+'원';document.getElementById('volume').textContent=Number(c.volume).toLocaleString('ko-KR');document.getElementById('count').textContent=String(candles.length);status.textContent='연결 성공: 알파봇에서 삼성전자 봉 데이터를 받았습니다.';}catch(e){status.textContent='연결 확인 실패: '+e.message;}}
document.getElementById('run').addEventListener('click',test);test();
</script></body></html>
